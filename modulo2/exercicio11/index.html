<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1{
            display: inline;
            background-color: lightblue;

            width: 300px;
            height: 300px;

            border-width: 10px;
            border-style: solid;
            border-color: beige;

            border: 10px solid beige;

            padding: 10px;
            margin: 10px auto;
            outline: 5px dashed red;
        }
        a{
            display: block;
            border-width: 10px;
            border-style: solid;
            border-color: black;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Paragrafos tambem são exemplos de box-level, mas os <a href="#">link são exemplos inline-level</a>. vamos ver como tudo isso funcioa.</p>
</body>
</html>
