<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>colocando video</h1>
    <!--<video src="midia/video MP4.mp4" controls width="500"></video>--><!--width para mexer na lagura ou altura do video, controls para o video funciona-->
    <video width="500" controls>
        <source src="midia/video MP4.mp4" type="video/mp4">
        <source src="midia/video MKV.mkv" type="video/mkv">
        <source src="midia/video MOV.mov" type="video/mov">
        <p>Seu navegador não tem compatibilidade com reprodução de video.</p><!--coloca video usando a tag fica muito pesado o que deixa mais caro a hospedagem-->
    </video>
    <h1>inserido video do youtube</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/3hng-hmSv2Y?si=KaVig22B-wdQUjuB"
    title="YouTube video player" frameborder="0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
