<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalhando com link</title>
</head>
<body>
    <h1>Usando links externo</h1>
    <p>fonte do <a href="https://github.com/gustavoguanabara/html-css/tree/master/aulas-pdf" target="_blank" rel="externo">conteudo</a></p><!--rel o tipo link no caso externo e target para direciona (uma janela em branco)-->
    <p>continue <a href="index2.html" rel="next">por aqui</a></p><!--você pode coloca target=_self para propria pagina ou não coloca nada-->
</body>
</html>
